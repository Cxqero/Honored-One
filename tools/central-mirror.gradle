// Route Maven Central through Google's mirror (repo.maven.apache.org rate-limits this egress IP)
def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2/'
def fix = { repos ->
    repos.configureEach { r ->
        if (r instanceof MavenArtifactRepository) {
            def u = r.url.toString()
            if (u.startsWith('https://repo.maven.apache.org') || u.startsWith('https://repo1.maven.org')) {
                r.url = MIRROR
            }
        }
    }
}
settingsEvaluated { s ->
    fix(s.pluginManagement.repositories)
    fix(s.dependencyResolutionManagement.repositories)
}
allprojects { p ->
    fix(p.buildscript.repositories)
    fix(p.repositories)
}
